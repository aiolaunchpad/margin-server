# Fly.io: `fly launch --copy-config --no-deploy` then `fly volumes create margin_data --size 1`,
# `fly secrets set OPENAI_API_KEY=... TOKEN_SECRET=$(openssl rand -hex 32)`, `fly deploy`.
app = "margin-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "8787"

[[mounts]]
  source = "margin_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "3s"
